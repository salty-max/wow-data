# Every push and pull request: the kit typechecks and its tests pass, the
# explorer typechecks and builds, the facts inbox typechecks and its tests pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun install --cwd explorer --frozen-lockfile
      - run: bun run --cwd explorer check
      - run: bun install --cwd server --frozen-lockfile
      - run: bun run --cwd server check
