# Every push and pull request: the kit typechecks and its tests pass, the
# explorer typechecks and builds. A pull request a job opened (pins, players)
# gets no pull_request run (GitHub starts none for its own token's events):
# that job dispatches this one on its branch instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun install --cwd explorer --frozen-lockfile
      - run: bun run --cwd explorer check
