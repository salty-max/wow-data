# Every day, and by hand: players' facts (what the game told the players who
# said yes to the addons' opt-in, sent by Ravenpost to the facts inbox,
# server/) merged into data/players (bin/players.ts). When they changed, a
# pull request, never merged by itself: once merged, the databases are built
# again (db.yml) and each addon's daily job takes them. The pull request's
# branch is merged into again while it waits, so nothing taken out of the
# inbox is lost. Needs the variable FACTS_SERVER (the inbox's address) and the
# secret FACTS_TOKEN (its token for wow-data, the same as on Vercel).
name: Players

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  players:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Merge
        id: pull
        env:
          FACTS_SERVER: ${{ vars.FACTS_SERVER }}
          FACTS_TOKEN: ${{ secrets.FACTS_TOKEN }}
        run: |
          if [ -z "$FACTS_SERVER" ] || [ -z "$FACTS_TOKEN" ]; then
            echo "No FACTS_SERVER variable or FACTS_TOKEN secret: nothing merged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # (the pull request still waiting: its facts are the start)
          if git fetch --depth=1 origin players 2>/dev/null; then
            git checkout FETCH_HEAD -- data/players 2>/dev/null || true
          fi
          bun bin/players.ts pull all | tee "$RUNNER_TEMP/players.txt"
          {
            echo "Players' facts merged from the inbox:"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/players.txt"
            echo
            echo "Opened by .github/workflows/players.yml. They fill only what no other source has (src/players.ts). Once merged, the databases are built again and each addon's daily job takes them."
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
          echo "pulled=true" >> "$GITHUB_OUTPUT"
      - run: bun run check
        if: steps.pull.outputs.pulled == 'true'
      - name: Pull request
        if: steps.pull.outputs.pulled == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: players
          delete-branch: true
          commit-message: "chore: players' facts"
          title: "chore: players' facts"
          body-path: ${{ runner.temp }}/body.md
          add-paths: data/players
      # (out of the inbox only once they're in the pull request)
      - name: Done
        if: steps.pull.outputs.pulled == 'true'
        env:
          FACTS_SERVER: ${{ vars.FACTS_SERVER }}
          FACTS_TOKEN: ${{ secrets.FACTS_TOKEN }}
        run: bun bin/players.ts done
