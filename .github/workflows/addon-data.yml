# An addon's game data built again from wow-data's pins: each addon's daily
# job (.github/workflows/game-data.yml in hearthtale, lorekeepers-codex,
# yonder, second-wind, palaver, mealbook, goodwill, yours-truly) calls this. wow-data checked out beside the addon (and
# addon-kit, for its glossary.py and subzones.py), the databases built from
# that wow-data downloaded (bin/get.ts: the release of the last commit that
# changed them, which must be published), the addon's own generators run.
# When a generated file changes: the addon's checks, then a pull request,
# its own ci.yml asked for on the branch, and the pull request rebased onto
# main by itself once that run passes (`merge`, on unless a caller says
# otherwise: nothing reaches the players before a release, which stays by
# hand; the pull request stays the day's record). A run that fails, can't be
# found or doesn't end in 30 minutes leaves the pull request waiting, never
# merged. A day without change ends after the generators.
# The calling repository needs "Allow GitHub Actions to create and approve
# pull requests" (Settings, Actions, General), `actions: write` among its
# permissions and `workflow_dispatch:` in its ci.yml.
name: Addon data

on:
  workflow_call:
    inputs:
      generate:
        description: "the commands writing the generated files (in the addon's folder, one shell script)"
        type: string
        required: true
      paths:
        description: "the generated files a pull request carries, one a line (git pathspecs, globs allowed)"
        type: string
        required: true
      check:
        description: "the addon's checks, run when something changed"
        type: string
        default: bun run check
      before:
        description: "run before the generators (Hearthtale keeps its last journals aside)"
        type: string
        default: ""
      report:
        description: "markdown for the pull request's body, written to stdout after the generators (Hearthtale's journals compared)"
        type: string
        default: ""
      kit:
        description: "addon-kit checked out beside the addon too"
        type: boolean
        default: false
      cache:
        description: "more paths kept between runs, one a line (from the workspace: addon/.cache/audit)"
        type: string
        default: ""
      merge:
        description: "the pull request rebased onto main once the checks pass (else left for a hand)"
        type: boolean
        default: true
    secrets:
      INBOX_EVENTS_TOKEN:
        description: "Ravenpost's inbox: the day told to the owner's phone (bin/tell.ts); without it, not told"
        required: false

jobs:
  data:
    runs-on: ubuntu-latest
    # (one day's run at a time in each addon: two would push the same branch)
    concurrency:
      group: addon-data-${{ github.repository }}
      cancel-in-progress: false
    env:
      REPO: ${{ github.event.repository.name }}
      # (no husky hooks in the job: its commit is the generators', checked above it)
      HUSKY: "0"
      INBOX_URL: ${{ vars.INBOX_URL }}
      INBOX_EVENTS_TOKEN: ${{ secrets.INBOX_EVENTS_TOKEN }}
    defaults:
      run:
        working-directory: addon
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: addon
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: salty-max/wow-data
          path: wow-data
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.kit
        with:
          repository: salty-max/addon-kit
          path: addon-kit
          # (its whole history: the addon's copies are compared with the kit
          # at their stamps, so a kit pushed since says stale, never fails)
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: wow-data
      # (the sources' downloads, kept: they change only when a pin moves)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            wow-data/.cache/wago
            wow-data/.cache/github
            ${{ inputs.cache }}
          key: addon-data-${{ hashFiles('wow-data/pins.json') }}-${{ github.run_id }}
          restore-keys: |
            addon-data-${{ hashFiles('wow-data/pins.json') }}-
            addon-data-
      - name: Lua (LuaJIT, StyLua, selene)
        run: |
          sudo apt-get install -y -qq luajit
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -sSLo stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          curl -sSLo selene.zip https://github.com/Kampfkarren/selene/releases/download/0.32.0/selene-0.32.0-linux.zip
          printf '%s  %s\n' bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab stylua.zip d3773393578580074386e69337d35b7acddfbaa9fc38964c07fa3e28436ade9b selene.zip | sha256sum -c --quiet -
          unzip -qo stylua.zip && unzip -qo selene.zip && chmod +x stylua selene
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: wow-data's databases (built from the wow-data checked out)
        working-directory: wow-data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(bun bin/db-tag.ts)
          bun bin/get.ts all --tag "$tag" --wait 600
          echo "WOW_DATA_AT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      - name: The data built again
        id: data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE: ${{ inputs.before }}
          GENERATE: ${{ inputs.generate }}
          PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          if [ -n "$BEFORE" ]; then bash -euo pipefail -c "$BEFORE"; fi
          bash -euo pipefail -c "$GENERATE"
          set -f
          mapfile -t specs < <(printf '%s\n' "$PATHS" | sed '/^\s*$/d')
          if [ -z "$(git status --porcelain -- "${specs[@]}")" ]; then
            echo "Nothing moved: the generated files are what wow-data's pins give (wow-data at $WOW_DATA_AT)." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --porcelain -- "${specs[@]}" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # (what changed, in words: Ravenpost's activity and the owner's phone)
      - name: The day in words
        if: steps.data.outputs.changed == 'true'
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          set -f
          mapfile -t specs < <(printf '%s\n' "$PATHS" | sed '/^\s*$/d')
          bun ../wow-data/bin/describe-data.ts "$REPO" "${specs[@]}" > "$RUNNER_TEMP/words.json"
          cat "$RUNNER_TEMP/words.json"
      - name: The pull request's words
        if: steps.data.outputs.changed == 'true'
        env:
          REPORT: ${{ inputs.report }}
          PATHS: ${{ inputs.paths }}
          MERGE: ${{ inputs.merge }}
        run: |
          set -euo pipefail
          set -f
          mapfile -t specs < <(printf '%s\n' "$PATHS" | sed '/^\s*$/d')
          {
            echo "The game data built again from [wow-data](https://github.com/salty-max/wow-data)'s pins (wow-data at $WOW_DATA_AT)."
            echo
            echo "### The generated files"
            echo
            echo '```'
            git diff --stat -- "${specs[@]}"
            git ls-files --others --exclude-standard -- "${specs[@]}" | sed 's/^/ (new) /'
            echo '```'
            if [ -n "$REPORT" ]; then
              echo
              bash -euo pipefail -c "$REPORT"
            fi
            echo
            if [ "$MERGE" = "true" ]; then
              echo "Opened by the daily Game data job (wow-data's addon-data.yml), the addon's checks passed. Merged by itself once its CI run on this branch passes, else it waits here for a hand."
            else
              echo "Opened by the daily Game data job (wow-data's addon-data.yml). Read the differences, then merge by hand."
            fi
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
      - name: The addon's checks
        if: steps.data.outputs.changed == 'true'
        env:
          CHECK: ${{ inputs.check }}
        run: bash -euo pipefail -c "$CHECK"
      - name: Pull request
        id: pr
        if: steps.data.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          path: addon
          branch: game-data
          delete-branch: true
          commit-message: |
            chore: the game's data at wow-data's pins

            wow-data: ${{ env.WOW_DATA_AT }}
          title: "chore: the game's data at wow-data's pins"
          body-path: ${{ runner.temp }}/body.md
          add-paths: ${{ inputs.paths }}
      # (its checks on the pull request: GitHub starts a pull_request run for
      # this job's own token but gives it no jobs, so the job asks for the
      # addon's ci.yml on the branch and waits for it. passed=true is written
      # in one place, after the run, its head and main are checked: anything
      # else leaves the pull request waiting for a hand, never merged)
      - name: Its checks
        id: gate
        if: steps.data.outputs.changed == 'true' && steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
          MERGE: ${{ inputs.merge }}
        run: |
          set -uo pipefail
          held() {
            echo "why=$1" >> "$GITHUB_OUTPUT"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ -n "$SHA" ] || held "The pull request's head is unknown: its checks weren't asked for."
          since=$(date -u -d '-30 seconds' +%Y-%m-%dT%H:%M:%SZ)
          answer=$(gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" -f ref=game-data -F return_run_details=true) \
            || held "ci.yml couldn't be asked for on game-data (its workflow_dispatch, or the caller's actions: write, missing?)."
          [ "$MERGE" = "true" ] || exit 0
          run=$(printf '%s' "$answer" | jq -r '.workflow_run_id // empty' 2>/dev/null) || run=""
          # (GitHub may answer without the run: found by the branch's head then)
          for wait in 5 5 10 10 15 15 20 20 20; do
            [ -n "$run" ] && break
            sleep "$wait"
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch game-data --event workflow_dispatch --commit "$SHA" --created ">=$since" --json databaseId --jq '.[0].databaseId // empty') || run=""
          done
          [ -n "$run" ] || held "The CI run asked for on game-data wasn't found in two minutes."
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
          timeout 1800 gh run watch "$run" -R "$GITHUB_REPOSITORY" --exit-status --interval 20 > /dev/null || true
          read -r status conclusion head < <(gh run view "$run" -R "$GITHUB_REPOSITORY" --json status,conclusion,headSha --jq '"\(.status) \(.conclusion) \(.headSha)"') || true
          [ "${status:-}" = completed ] || held "Its CI run ($url) wasn't seen to end (30 minutes at most)."
          [ "${conclusion:-}" = success ] || held "Its CI run ($url) ended ${conclusion:-without a verdict}."
          [ "${head:-}" = "$SHA" ] || held "Its CI run ($url) checked ${head:-another commit}, not the pull request's head $SHA."
          # (the tested head must already hold its base: the rebase then moves nothing)
          base=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName) || base=""
          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$SHA" --jq .behind_by) || behind=""
          [ -n "$base" ] && [ "$behind" = 0 ] || held "${base:-The base} moved while its checks ran (or couldn't be compared): not merged untested."
          echo "Its CI run passed: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "passed=true" >> "$GITHUB_OUTPUT"
      # (GitHub may need a moment to see the new pull request as mergeable)
      - name: Merge
        if: steps.data.outputs.changed == 'true' && inputs.merge && steps.gate.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
          URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          base=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          for wait in 5 15 30 60; do
            sleep "$wait"
            # (main again, just before each try: a push since the checks would be rebased onto untested)
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$SHA" --jq .behind_by)" != 0 ]; then
              echo "$base moved after its checks: not merged untested, merge it by hand." >> "$GITHUB_STEP_SUMMARY"
              bun ../wow-data/bin/tell.ts --kind waiting --repo "$REPO" --url "$URL" --title "$(jq -r .title "$RUNNER_TEMP/words.json"), waiting for you" --body "$base moved after its checks passed. The pull request waits for you."
              exit 0
            fi
            if gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --rebase --delete-branch --match-head-commit "$SHA"; then
              echo "Merged #$PR." >> "$GITHUB_STEP_SUMMARY"
              bun ../wow-data/bin/tell.ts --kind merged --repo "$REPO" --url "$URL" --from "$RUNNER_TEMP/words.json"
              exit 0
            fi
          done
          echo "#$PR could not be merged by itself: merge it by hand." >> "$GITHUB_STEP_SUMMARY"
          # (said once, as waiting: not a failure besides)
          bun ../wow-data/bin/tell.ts --kind waiting --repo "$REPO" --url "$URL" --title "$(jq -r .title "$RUNNER_TEMP/words.json"), waiting for you" --body "Its pull request couldn't be merged by itself."
      # (its checks didn't pass: told as waiting, and the run red)
      - name: Not merged
        id: held
        if: steps.data.outputs.changed == 'true' && inputs.merge && steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed' && steps.gate.outputs.passed != 'true'
        env:
          URL: ${{ steps.pr.outputs.pull-request-url }}
          WHY: ${{ steps.gate.outputs.why }}
        run: |
          echo "Not merged: the pull request waits for a hand." >> "$GITHUB_STEP_SUMMARY"
          bun ../wow-data/bin/tell.ts --kind waiting --repo "$REPO" --url "$URL" --title "$(jq -r .title "$RUNNER_TEMP/words.json"), not merged" --body "${WHY:-Its checks failed.} The pull request waits for you."
          exit 1
      - name: Waiting for a hand
        if: steps.data.outputs.changed == 'true' && !inputs.merge && steps.pr.outputs.pull-request-number != ''
        env:
          URL: ${{ steps.pr.outputs.pull-request-url }}
        run: bun ../wow-data/bin/tell.ts --kind waiting --repo "$REPO" --url "$URL" --from "$RUNNER_TEMP/words.json"
      # (a pull request not merged is told once, above)
      - name: Failed
        if: failure() && steps.held.outcome != 'failure'
        env:
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bun ../wow-data/bin/describe-data.ts --failed "$REPO" > "$RUNNER_TEMP/failed.json"
          bun ../wow-data/bin/tell.ts --kind failed --repo "$REPO" --url "$URL" --from "$RUNNER_TEMP/failed.json"
