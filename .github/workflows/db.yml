# The databases (PLAN.md): built from the pins on every change of what makes
# them, tested, and published as a release (db-<commit>, the latest), each
# game's file gzipped. An addon's job downloads it (bin/get.ts) rather than
# building it. The downloads are kept between runs, keyed on the pins.
name: Databases

on:
  push:
    branches: [main]
    paths: [pins.json, schema.sql, "src/**", "bin/**", "data/**", ".github/workflows/db.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: databases
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache/wago
            .cache/github
            .cache/questie
            .cache/tools
          key: sources-${{ hashFiles('pins.json') }}-${{ github.run_id }}
          restore-keys: |
            sources-${{ hashFiles('pins.json') }}-
            sources-
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun bin/build.ts all
      - name: Test
        run: bun run check
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(bun bin/db-tag.ts)
          if gh release view "$tag" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt" 2>/dev/null; then
            if grep -qx 'classic.db.gz' "$RUNNER_TEMP/assets.txt" && grep -qx 'forever.db.gz' "$RUNNER_TEMP/assets.txt"; then
              echo "$tag is already published."
              exit 0
            fi
            # (a run cancelled while uploading left the release half there: finished, not made again)
            gzip -k -9 .cache/db/classic.db .cache/db/forever.db
            gh release upload "$tag" .cache/db/classic.db.gz .cache/db/forever.db.gz --clobber
            gh release edit "$tag" --latest
            exit 0
          fi
          gzip -k -9 .cache/db/classic.db .cache/db/forever.db
          {
            echo "The game databases built from pins.json at $(git rev-parse --short=12 HEAD)."
            echo
            echo '```json'
            cat pins.json
            echo '```'
            echo
            echo "Download with bun bin/get.ts, or by hand: each file gunzipped is a SQLite database (schema.sql)."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" .cache/db/classic.db.gz .cache/db/forever.db.gz \
            --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --target "$(git rev-parse HEAD)" --latest
          # (the five latest kept)
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^db-' | tail -n +6 |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
      - name: Failed
        if: failure()
        env:
          INBOX_URL: ${{ vars.INBOX_URL }}
          INBOX_EVENTS_TOKEN: ${{ secrets.INBOX_EVENTS_TOKEN }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun bin/tell.ts --kind failed --repo wow-data --url "$URL" --title "wow-data's databases didn't build" --body "The addons' data jobs wait for them. The run says why."
